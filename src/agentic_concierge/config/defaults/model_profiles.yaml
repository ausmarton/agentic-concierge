# Model capability profiles — shipped defaults.
#
# Override by placing a model_profiles.yaml in ~/.config/concierge/
# or by setting CONCIERGE_MODEL_PROFILES_PATH to a custom file.
#
# Only the profiles you specify in overrides are merged; all other
# profiles remain at their shipped default values.
#
# Capability scores range from 0.0 (no capability) to 1.0 (best-in-class).
# supports_tool_calling: whether the model can produce OpenAI-style function calls.

profiles_version: 1

profiles:
