# Backend configuration — shipped defaults.
#
# Override by placing a backends.yaml in ~/.config/concierge/
# or by setting CONCIERGE_BACKENDS_PATH to a custom file.
#
# Only the sections you specify in overrides are merged; all other
# sections remain at their shipped default values.

backends_version: 1

# Backend endpoints (replaces DEFAULT_BACKEND_URLS in constants.py).
# Each backend maps to its OpenAI-compatible base URL.
backends:
  ollama:
    url: "http://localhost:11434/v1"
  vllm:
    url: "http://localhost:8000/v1"
  llama_cpp:
    managed: true
    binary: "llama-server"
    model_dir: ""              # directory containing .gguf files; empty = disabled
    n_gpu_layers: -1           # -1 = all layers on GPU; 0 = CPU only
    ctx_size: 8192

# Per-tier backend priority (replaces BACKEND_PRIORITY in features.py).
# resolve_llm() tries backends in this order when the configured primary fails.
# llama_cpp uses Vulkan/Metal/CUDA and works on all platforms including AMD gfx1151.
# vLLM requires CUDA/ROCm and is best for high-throughput concurrent requests.
tier_priority:
  nano: ["inprocess", "ollama", "cloud"]
  small: ["ollama", "inprocess", "cloud"]
  medium: ["ollama", "llama_cpp", "inprocess", "cloud"]
  large: ["ollama", "llama_cpp", "vllm", "inprocess", "cloud"]
  server: ["ollama", "llama_cpp", "vllm", "inprocess", "cloud"]
